name: Verify workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 90_系統/應用程式/package-lock.json
      - run: npm run setup
      - run: npm run init
      - run: npm run verify
      - run: npm run check:release

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build committed public source only
        shell: bash
        run: git archive HEAD | docker build -f 90_系統/環境/Dockerfile -t workbench-verify -
      - name: Verify without external network or host data
        run: docker run --rm --network none workbench-verify
